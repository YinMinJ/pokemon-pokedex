name: Deploy Pokedex to GitHub Pages

# 站点源文件在 site/ 目录（GitHub Pages 的分支模式只认 / 或 /docs，所以用 Actions 发布）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包 site/ 为站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
